services:
  hpxpanel:
    image: ghcr.io/pooyahpx/hpxpanel:latest
    restart: always
    env_file: .env
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ${HPX_DATA_DIR:-/var/lib/hpxpanel}:/var/lib/hpxpanel
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/code/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
