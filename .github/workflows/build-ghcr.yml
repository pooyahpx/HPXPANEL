name: Build and push panel image (GHCR)

# Builds HPXPANEL (backend + prebuilt dashboard) and pushes to GHCR.
# Installer expects: ghcr.io/pooyahpx/hpxpanel:latest
# Image push is gated on sqlite migrations + unit tests.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "cli/**"
      - "dashboard/**"
      - "Dockerfile"
      - "start.sh"
      - "build_dashboard.sh"
      - "cli_wrapper.sh"
      - "hpxpanel-cli.py"
      - "tui_wrapper.sh"
      - "healthcheck.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/**"
      - ".github/workflows/build-ghcr.yml"
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-tags: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set DATABASE_URL
        run: |
          echo "TEST_FROM=github" >> $GITHUB_ENV
          echo "TESTING=1" >> $GITHUB_ENV
          echo "SQLALCHEMY_DATABASE_URL=sqlite+aiosqlite:///./test.db" >> $GITHUB_ENV

      - name: Install test dependencies
        run: make setup-test

      - name: Run Alembic Migrations
        run: make run-migration

      - name: Check Migrations
        run: make check-migrations

      - name: Run Tests
        run: make test

  build-dashboard:
    needs: test-sqlite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-tags: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Install dashboard deps
        working-directory: ./dashboard
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: ./build_dashboard.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: ./dashboard/build/
          retention-days: 1

  build-and-push:
    needs: [test-sqlite, build-dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-tags: false

      - uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: ./dashboard/build/

      - name: Compute tags
        id: meta
        run: |
          set -eux
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/hpxpanel"
          tags="${image}:latest,${image}:${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${image}:${GITHUB_REF_NAME}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=HPXPANEL
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### HPXPANEL image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
