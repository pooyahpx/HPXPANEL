<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>HPX Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="boot" class="boot" aria-live="polite">
      <div class="boot-mark" aria-hidden="true"></div>
      <p class="boot-title">HPXPANEL</p>
      <p class="boot-sub" id="boot-sub">در حال آماده‌سازی…</p>
    </div>

    <div id="app" class="app is-hidden" hidden>
      <header class="topbar">
        <div class="identity">
          <div class="avatar" id="avatar" aria-hidden="true"></div>
          <div class="identity-text">
            <p class="brand">HPX</p>
            <h1 class="hello" id="hello">—</h1>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="chip-btn" id="lang-toggle" aria-label="Language">FA</button>
          <button type="button" class="icon-btn" id="refresh-btn" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" stroke-linecap="round" />
              <path d="M21 3v6h-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </header>

      <main id="view" class="view"></main>

      <nav class="dock" id="dock" aria-label="Main"></nav>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="./app.js" defer></script>
  </body>
</html>
